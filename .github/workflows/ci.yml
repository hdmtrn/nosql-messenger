name: CI

on:
  push:
  pull_request:
  # A manual trigger, because a push does not always produce a run: pushing many
  # branches at once, GitHub created a run for one of them and skipped the rest.
  workflow_dispatch:

# The four jobs are independent and run in parallel: none of them consumes what
# another produces. Go compiles fast and setup-go restores the build cache, so
# each job running its own `go` command costs less than passing binaries
# between jobs would.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go vet ./...

      # gofmt -l only lists the files it would reformat and exits 0 either way,
      # so an empty list has to be turned into success by hand.
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # -short makes testDB skip the tests that need MongoDB, so this job
      # reports on the in-memory code even when the database cannot start.
      # -race is ThreadSanitizer: hub_test.go exercises concurrent access to
      # the hub, and bugs of that kind are not found by reading the code.
      - name: Unit tests
        run: go test -race -short ./...

  integration:
    runs-on: ubuntu-latest
    # Throwaway values for a throwaway database. With them both compose and the
    # tests go through a login to MongoDB and a password to Redis, as in
    # production, while locally both stay empty. root, because the tests create
    # a database of their own each.
    env:
      MONGO_ROOT_USERNAME: root
      MONGO_ROOT_PASSWORD: ci-mongo-root
      MONGO_USERNAME: root
      MONGO_PASSWORD: ci-mongo-root
      REDIS_PASSWORD: ci-redis
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Not a services: block but the same docker compose as on the dev machine
      # — one description of the database instead of two that will inevitably
      # drift apart.
      - name: Start MongoDB and Redis
        run: docker compose up -d --wait mongo redis

      # Runs the unit tests again as well; they take milliseconds, and keeping
      # them in makes this job a complete run on its own.
      # CI=true makes testDB FAIL when the database is unreachable instead of
      # skipping: a skipped test looks like a passed one. GitHub sets it on
      # every runner anyway; it is spelled out because the tests depend on it.
      - name: Integration tests
        run: go test -race ./...
        env:
          CI: "true"
          MONGO_URI: mongodb://127.0.0.1:27017
          # 127.0.0.1 rather than localhost for the same reason as above: compose
          # publishes both ports on the IPv4 loopback only, and on the runner
          # "localhost" resolves to ::1 first — which is exactly how this job
          # failed the first time Redis was needed.
          REDIS_ADDR: 127.0.0.1:6379

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile builds the frontend and the Go binary itself, so this one
      # step covers both builds. The image is thrown away: it only proves the
      # Dockerfile still builds. The production image is arm64 and is built
      # outside CI, on the machine that deploys it.
      # --progress=plain keeps the full output of every RUN in the log instead
      # of collapsing it, which is what a failed build needs.
      - name: Build image
        run: docker build --progress=plain .
