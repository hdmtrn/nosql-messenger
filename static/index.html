<!doctype html>
<meta charset="utf-8">
<title>ws demo</title>
<style>
  body { font: 14px/1.5 monospace; max-width: 640px; margin: 24px auto; }
  #log { border: 1px solid #999; height: 320px; overflow-y: auto; padding: 8px; margin: 12px 0; }
  #log div { margin-bottom: 4px; }
  .sys { color: #888; }
  .me { color: #06c; }
  .err { color: #c00; }
  input, button { font: inherit; padding: 4px 8px; }
  #text { width: 420px; }
  .hidden { display: none; }
</style>

<div id="auth">
  <p>
    user <input id="user" value="alice" size="10">
    password <input id="pass" type="password" value="correct horse battery" size="20">
  </p>
  <p>
    <button id="login">log in</button>
    <button id="register">register</button>
    <span id="authErr" class="err"></span>
  </p>
</div>

<div id="chat" class="hidden">
  <p>
    signed in as <b id="who"></b>
    <button id="logout">log out</button>
    channel <input id="channel" value="c1" size="6">
    <button id="connect">connect</button>
    <span id="status" class="sys">disconnected</span>
  </p>

  <div id="log"></div>

  <p>
    <input id="text" placeholder="message" disabled>
    <button id="send" disabled>send</button>
  </p>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let ws = null;

  function add(text, cls) {
    const d = document.createElement('div');
    d.textContent = text;
    if (cls) d.className = cls;
    $('log').append(d);
    $('log').scrollTop = $('log').scrollHeight;
  }

  function showChat(username) {
    $('who').textContent = username;
    $('auth').classList.add('hidden');
    $('chat').classList.remove('hidden');
  }

  function showAuth() {
    $('auth').classList.remove('hidden');
    $('chat').classList.add('hidden');
  }

  async function checkSession() {
    const r = await fetch('/auth/me');
    if (r.ok) { showChat((await r.json()).username); return true; }
    showAuth();
    return false;
  }

  async function auth(path) {
    $('authErr').textContent = '';
    const r = await fetch(path, {
      method: 'POST',
      body: JSON.stringify({ username: $('user').value, password: $('pass').value }),
    });
    const body = await r.json();
    if (!r.ok) { $('authErr').textContent = body.error; return; }
    if (!await checkSession()) {
      $('authErr').textContent =
        'server accepted the login but the cookie was not stored (Secure over plain http?)';
    }
  }

  $('login').onclick = () => auth('/auth/login');
  $('register').onclick = () => auth('/auth/register');

  $('logout').onclick = async () => {
    if (ws) ws.close();
    await fetch('/auth/logout', { method: 'POST' });
    $('log').innerHTML = '';
    showAuth();
  };

  $('connect').onclick = () => {
    if (ws) { ws.close(); return; }

    const channel = encodeURIComponent($('channel').value);
    ws = new WebSocket(`ws://${location.host}/ws?channel=${channel}`);

    ws.onopen = () => {
      $('status').textContent = 'connected';
      $('connect').textContent = 'disconnect';
      $('text').disabled = $('send').disabled = false;
      add('— connection opened —', 'sys');
    };

    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      const mine = m.from === $('who').textContent;
      add(`[${m.at.slice(11, 19)}] ${m.from}: ${m.text}`, mine ? 'me' : null);
    };

    ws.onerror = () => add('— handshake failed (not authenticated?) —', 'err');

    ws.onclose = () => {
      $('status').textContent = 'disconnected';
      $('connect').textContent = 'connect';
      $('text').disabled = $('send').disabled = true;
      add('— connection closed —', 'sys');
      ws = null;
    };
  };

  function send() {
    if (ws && $('text').value) { ws.send($('text').value); $('text').value = ''; }
  }
  $('send').onclick = send;
  $('text').onkeydown = (e) => { if (e.key === 'Enter') send(); };

  checkSession();
</script>
