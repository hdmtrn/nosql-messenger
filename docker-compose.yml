services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    # Loopback only: the database is not exposed, neither locally nor on the
    # instance. Admin access on the instance goes through an SSH tunnel.
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: >-
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}) }"

  redis:
    image: redis:8.0-alpine
    # No volume and no persistence: the bus carries only what may be lost on a
    # restart. Saving it to disk would buy nothing and cost writes.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Loopback only, like mongo. Nothing outside the instance talks to it.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  app:
    # build is for local work; image is so that on the instance, which has no
    # sources, this same file starts the image delivered by docker load
    # (docker compose up -d --no-build).
    build: .
    image: messenger:latest
    depends_on:
      redis:
        condition: service_healthy
      # A healthy mongod does NOT yet mean an initiated replica set, and the app
      # fails its ping against an uninitiated one. So it waits not for mongo but
      # for the one-shot mongo-init to exit with code zero.
      mongo-init:
        condition: service_completed_successfully
    environment:
      # directConnection is required: the replica set was initiated as
      # mongo:27017, and without this flag the driver would follow the
      # advertised topology instead of the address in the URI.
      MONGO_URI: "mongodb://mongo:27017/?directConnection=true"
      REDIS_ADDR: "redis:6379"
      # The code defaults to true, and the browser will not accept such a cookie
      # over http, so login would not work. On the instance with TLS the
      # variable is not set.
      COOKIE_SECURE: "false"
    # Two nodes from the start, so that anything that works only inside one
    # process breaks here and not on the instance. Each replica takes one host
    # port from the range: 8080 and 8081. There is no load balancer in front of
    # them on purpose — two browsers on two ports make it obvious which node
    # answers, which a round-robin proxy would hide.
    deploy:
      replicas: 2
    ports:
      - "8080-8081:8080"
    volumes:
      # Let's Encrypt certificate cache. It must survive restarts: otherwise
      # autocert requests a certificate every time and hits the weekly limit
      # (5 per domain). Stays empty until the autocert step.
      - autocert-cache:/app/certs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  mongo-data:
  autocert-cache:
