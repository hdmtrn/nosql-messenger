AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The messenger on ECS Fargate: the application nodes behind an ALB and Redis
  as the bus between them. MongoDB is Atlas, outside this stack. A new version
  is a deploy of this template with another ImageTag, by infra/deploy.sh. The
  stack creates no IAM: the one role it hands out comes from bootstrap.

Parameters:
  ImageTag:
    Type: String
    Description: Tag in the messenger repository, sha-<commit> as CI pushes it.
  CertificateArn:
    Type: String
    Description: ACM certificate for the site's domain, in this region.
  DesiredCount:
    Type: Number
    Default: 2
    Description: Application nodes. Two from the start, as in compose.
  BootstrapStackName:
    Type: String
    Default: messenger-bootstrap
  NetworkStackName:
    Type: String
    Default: messenger-network
  ParameterPrefix:
    Type: String
    Default: /messenger
    Description: SSM path holding the settings and secrets, created by hand.

Resources:
  Cluster:
    Type: AWS::ECS::Cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /ecs/${AWS::StackName}
      RetentionInDays: 14

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP and HTTPS to the load balancer
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        # Only to be redirected to 443.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application nodes, reachable from the load balancer only
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  RedisSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Redis, reachable from the application nodes only
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 6379
          ToPort: 6379
          SourceSecurityGroupId: !Ref AppSecurityGroup

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Split
        - ","
        - !ImportValue
          Fn::Sub: ${NetworkStackName}-PublicSubnets
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      LoadBalancerAttributes:
        # Server pings every socket each 30 s (pingPeriod in ws.go), so an open
        # socket is never idle this long; the margin covers a late ping.
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId
      # Fargate tasks are registered by IP.
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        # ECS sends SIGTERM only after this delay. When it ends the ALB closes
        # the sockets still open and clients reconnect to another node, so a
        # longer delay only slows every deploy down.
        - Key: deregistration_delay.timeout_seconds
          Value: "20"

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  # Redis is found by a DNS name in the VPC. Service Connect would put an Envoy
  # proxy in between, and the bus holds a pub/sub connection that can stay
  # silent long enough for a proxy idle timeout to cut it.
  Namespace:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: messenger.internal
      Vpc: !ImportValue
        Fn::Sub: ${NetworkStackName}-VpcId

  RedisDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: redis
      NamespaceId: !Ref Namespace
      DnsConfig:
        RoutingPolicy: MULTIVALUE
        DnsRecords:
          - Type: A
            TTL: 10

  RedisTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: ${BootstrapStackName}-TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: redis
          # The Docker Hub library image through ECR Public: no anonymous pull
          # limit on the NAT's address.
          Image: public.ecr.aws/docker/library/redis:8.0-alpine
          Essential: true
          # The image's entrypoint drops root before starting redis-server; the
          # shell is only there to put the secret into the arguments. No
          # persistence, as in compose: the bus carries only what may be lost.
          Command:
            - sh
            - -c
            - exec docker-entrypoint.sh redis-server --requirepass "$REDIS_PASSWORD" --save '' --appendonly no
          PortMappings:
            - ContainerPort: 6379
          Secrets:
            - Name: REDIS_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/redis-password
          HealthCheck:
            Command: ["CMD-SHELL", 'redis-cli --no-auth-warning -a "$REDIS_PASSWORD" ping']
            Interval: 10
            Timeout: 3
            Retries: 3
            StartPeriod: 5
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: redis

  RedisService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref RedisTaskDefinition
      LaunchType: FARGATE
      DesiredCount: 1
      # A single instance: replacing it means stopping it first. The nodes
      # resync from MongoDB after the gap, as after any Redis restart.
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref RedisSecurityGroup
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: ${NetworkStackName}-PrivateSubnets
      ServiceRegistries:
        - RegistryArn: !GetAtt RedisDiscovery.Arn

  AppTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      # The image is built for arm64.
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !ImportValue
        Fn::Sub: ${BootstrapStackName}-TaskExecutionRoleArn
      ContainerDefinitions:
        - Name: app
          Image: !Sub
            - ${Repository}:${ImageTag}
            - Repository: !ImportValue
                Fn::Sub: ${BootstrapStackName}-RepositoryUri
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          # shutdownTimeout in main.go is 20 s; ECS kills the process after this.
          StopTimeout: 25
          Environment:
            - Name: REDIS_ADDR
              Value: redis.messenger.internal:6379
            # The client address comes from X-Forwarded-For, which the ALB sets.
            - Name: TRUST_PROXY
              Value: "true"
          Secrets:
            - Name: MONGO_URI
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/mongo-uri
            - Name: MONGO_USERNAME
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/mongo-username
            - Name: MONGO_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/mongo-password
            - Name: REDIS_PASSWORD
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/redis-password
            - Name: OPERATOR_NAME
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/operator-name
            - Name: OPERATOR_EMAIL
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/operator-email
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  AppService:
    Type: AWS::ECS::Service
    # A target group can be attached to a service only once a listener ties it
    # to the load balancer. A node that finds no Redis exits at start, so on a
    # fresh stack Redis has to be up first.
    DependsOn: [HttpsListener, RedisService]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref AppTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      # Covers the start: connecting to Atlas and building indexes come before
      # the listener opens.
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        # A version whose tasks keep failing is rolled back by ECS, and the
        # stack update fails with it, which turns the deploy job red.
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref AppSecurityGroup
          Subnets: !Split
            - ","
            - !ImportValue
              Fn::Sub: ${NetworkStackName}-PrivateSubnets
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  LoadBalancerDns:
    Description: Point the site's domain here with a CNAME record.
    Value: !GetAtt LoadBalancer.DNSName
