AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Long-lived pieces of the messenger deployment: the image repository, the NAT
  address, and the roles. Cheap enough to keep while the network and the
  application are torn down between demos. Deployed by hand, never from CI.

Parameters:
  # GitHub signs this repository's tokens with owner and repository ids next
  # to the names, as the repository's OIDC settings choose. The ids never
  # change, so a repository recreated under the same name gets no access.
  GitHubRepo:
    Type: String
    Default: hdmtrn@173386343/nosql-messenger@1380244670
    Description: owner@id/name@id of the repository whose CI may push images.
  AppStackName:
    Type: String
    Default: messenger-app
    Description: Name of the application stack deploy.sh creates and updates.
  ParameterPrefix:
    Type: String
    Default: /messenger
    Description: SSM path holding the settings and secrets the tasks read.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >-
      An account holds one GitHub OIDC provider. Set false if it already exists.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: messenger
      # A tag, once pushed, always names the same image: v1.0 cannot be moved to
      # another build behind the deploy's back.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Releases are kept; a rule below cannot expire an image this one matches",
                "selection": {"tagStatus": "tagged", "tagPatternList": ["v*"], "countType": "imageCountMoreThan", "countNumber": 1000},
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Untagged layers left by failed pushes",
                "selection": {"tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 1},
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 3,
                "description": "Builds of main that were never released",
                "selection": {"tagStatus": "tagged", "tagPrefixList": ["sha-"], "countType": "imageCountMoreThan", "countNumber": 30},
                "action": {"type": "expire"}
              }
            ]
          }

  # Lives here rather than with the NAT gateway so that the address survives the
  # network stack: Atlas allows connections from this one IP.
  NatAddress:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: messenger-nat

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com

  # The only way from GitHub into the account: CI on main pushes the image of
  # every commit that passed. Deploying is done by hand with deploy.sh.
  PushRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/main
      Policies:
        - PolicyName: push-image
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:DescribeImages
                Resource: !GetAtt Repository.Arn

  # Used by ECS, not by the code: pulls the image, writes the logs and reads the
  # SSM parameters into the containers' environment. Here rather than in the
  # app stack, so that CloudFormation never needs to create a role.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-settings
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ParameterPrefix}/*

  # What CloudFormation acts as when deploy.sh updates the application stack.
  # Only the services that stack is made of: a template, whoever wrote it,
  # reaches nothing else in the account and creates no IAM.
  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: app-stack
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecs:CreateCluster
                  - ecs:DeleteCluster
                  - ecs:DescribeClusters
                  - ecs:UpdateCluster
                  - ecs:RegisterTaskDefinition
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeTaskDefinition
                  - ecs:CreateService
                  - ecs:UpdateService
                  - ecs:DeleteService
                  - ecs:DescribeServices
                  - ecs:TagResource
                  - ecs:UntagResource
                  - ecs:ListTagsForResource
                  - ecs:PutClusterCapacityProviders
                  - ecs:UpdateClusterSettings
                  # The service handler follows a deployment through these and
                  # stops one that is rolled back.
                  - ecs:ListServiceDeployments
                  - ecs:DescribeServiceDeployments
                  - ecs:StopServiceDeployment
                Resource: "*"
              - Effect: Allow
                Action: elasticloadbalancing:*
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:Describe*
                  - ec2:CreateSecurityGroup
                  - ec2:DeleteSecurityGroup
                  - ec2:AuthorizeSecurityGroupIngress
                  - ec2:RevokeSecurityGroupIngress
                  - ec2:AuthorizeSecurityGroupEgress
                  - ec2:RevokeSecurityGroupEgress
                  - ec2:CreateTags
                  - ec2:DeleteTags
                  - ec2:UpdateSecurityGroupRuleDescriptionsIngress
                  - ec2:UpdateSecurityGroupRuleDescriptionsEgress
                  # Called by ELB on the caller's behalf when the ALB gets its
                  # security group; not a Describe, and missing from the
                  # resource schema, so only a real create showed it.
                  - ec2:GetSecurityGroupsForVpc
                Resource: "*"
              # Cloud Map keeps a private namespace as a Route 53 hosted zone.
              - Effect: Allow
                Action:
                  - servicediscovery:*
                  - route53:CreateHostedZone
                  - route53:DeleteHostedZone
                  - route53:GetHostedZone
                  - route53:ListHostedZonesByName
                  - route53:ChangeResourceRecordSets
                  - route53:ListResourceRecordSets
                  - route53:GetChange
                  - route53:ChangeTagsForResource
                Resource: "*"
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:DeleteLogGroup
                  - logs:PutRetentionPolicy
                  - logs:DeleteRetentionPolicy
                  - logs:TagResource
                  - logs:UntagResource
                  - logs:ListTagsForResource
                  - logs:GetDataProtectionPolicy
                  - logs:DeleteDataProtectionPolicy
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/${AppStackName}*
              - Effect: Allow
                Action:
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:DescribeIndexPolicies
                  # The cluster handler reads key metadata; no use of a key.
                  - kms:DescribeKey
                Resource: "*"
              # The one role the stack hands out, and only to ECS tasks.
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt TaskExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              # The task definition handler reads that role before passing it.
              - Effect: Allow
                Action: iam:GetRole
                Resource: !GetAtt TaskExecutionRole.Arn
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com

Outputs:
  RepositoryUri:
    Value: !GetAtt Repository.RepositoryUri
    Export:
      Name: !Sub ${AWS::StackName}-RepositoryUri
  NatAllocationId:
    Value: !GetAtt NatAddress.AllocationId
    Export:
      Name: !Sub ${AWS::StackName}-NatAllocationId
  NatPublicIp:
    Description: Add this address to the Atlas IP access list.
    Value: !Ref NatAddress
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskExecutionRoleArn
  PushRoleArn:
    Value: !GetAtt PushRole.Arn
  CfnExecutionRoleArn:
    Value: !GetAtt CfnExecutionRole.Arn
